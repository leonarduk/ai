name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  # `secrets` isn't a valid context in a job's `if:` (only github/vars/needs/inputs
  # are), so checking whether ANTHROPIC_API_KEY is set has to happen in a step (where
  # secrets *can* be read via env) and be surfaced as a job output for the real job's
  # `if:` to depend on via `needs`.
  check-secret:
    if: ${{ github.actor != 'dependabot[bot]' && vars.ENABLE_CLAUDE_REVIEW != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "has_key=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  ai-review:
    needs: check-secret
    # Skip (not fail) when ANTHROPIC_API_KEY isn't set yet, so an incomplete
    # secrets setup doesn't turn into a failing required check.
    if: ${{ needs.check-secret.outputs.has_key == 'true' }}
    permissions:
      pull-requests: write
      contents: read
      issues: write
    uses: ./.github/workflows/_ai-pr-review.yml
    with:
      provider_name: Claude
      provider_id: claude
      # cicaid-devtools has no CLI entry point for Anthropic yet, so the
      # legacy local script is used (review_script takes precedence over
      # review_module in the shared workflow). review_module is kept as the
      # canonical provider mapping for future module-based use.
      review_module: cicaid_devtools.lib.anthropic_review
      review_script: .github/scripts/claude_review.py
      workflow_file: claude-pr-review.yml
      anthropic_max_tokens: "6000"
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      cicaid_pro_token: ${{ secrets.CICAID_PRO_TOKEN }}

  # Dependabot PRs skip the review job above, which GitHub records as "skipped"
  # rather than "success". This job's name reproduces the composite check
  # context a real reusable-workflow run would produce ("ai-review / Claude
  # AI code review"), so any branch protection rule keyed on that exact
  # string still gets satisfied for Dependabot PRs.
  #
  # This context is NOT currently a required status check on `main` (only
  # DeepSeek's is — see deepseek-pr-review.yml). Kept here for consistency
  # and in case this context is ever made required in the future.
  dependabot-pass:
    name: ai-review / Claude AI code review
    if: github.actor == 'dependabot[bot]'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot PR — Claude review not required, passing."
